# ==============================================================================
# VINAXO Corporate Website — Hardened Production Nginx Configuration
# Domain: https://vinaxo.vn/
# Security Baseline: CIS Benchmark / Mozilla SSL Modern Guidelines
# ==============================================================================

# Hide Nginx version banner (prevent version reconnaissance)
server_tokens off;

# Rate limiting zone for general requests & contact forms
limit_req_zone $binary_remote_addr zone=vinaxo_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=vinaxo_forms:10m rate=3r/s;

# ------------------------------------------------------------------------------
# 1. HTTP Server — Automatic Redirect to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name vinaxo.vn www.vinaxo.vn;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all plain HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Canonical Redirect — www to apex domain (https://vinaxo.vn)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vinaxo.vn;

    ssl_certificate /etc/letsencrypt/live/vinaxo.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vinaxo.vn/privkey.pem;

    return 301 https://vinaxo.vn$request_uri;
}

# ------------------------------------------------------------------------------
# 3. Main Production HTTPS Server
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vinaxo.vn;

    root /var/www/vinaxo/dist;
    index index.html;

    # SSL / TLS Modern Parameters
    ssl_certificate /etc/letsencrypt/live/vinaxo.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vinaxo.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ==========================================================================
    # Security Headers
    # ==========================================================================
    # HTTP Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prevent MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), vr=()" always;

    # Content Security Policy (tailored to VINAXO fonts and assets)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://images.unsplash.com blob:; connect-src 'self'; frame-src 'self' https://www.google.com https://maps.google.com; frame-ancestors 'self'; form-action 'self' mailto:; base-uri 'self'; object-src 'none';" always;

    # Cross-Origin Policies
    add_header X-XSS-Protection "1; mode=block" always;

    # Buffer & Request limits
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    client_max_body_size 5M;
    large_client_header_buffers 2 1k;

    # Timeouts to mitigate Slowloris attacks
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 65;
    send_timeout 10;

    # Disable directory listing
    autoindex off;

    # Enable Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting application
    limit_req zone=vinaxo_general burst=30 nodelay;

    # Block access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to backup/dump/config files
    location ~* \.(bak|config|sql|dump|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static Assets Caching (1 year immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Security txt location
    location = /.well-known/security.txt {
        allow all;
        access_log off;
    }

    # Robots and Sitemap
    location = /robots.txt {
        allow all;
        access_log off;
    }

    location = /sitemap.xml {
        allow all;
        access_log off;
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Custom Error Pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
